[package]
name = "octosync"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/jonasehrlich/octosync"

[dependencies]
anyhow = "1"
astral-tokio-tar = "0.6.4"
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
atomic-write-file = "0.3.1"
bon = { version = "3.9" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = { version = "6" }
fs2 = { version = "0.4" }
futures = "0.3.32"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
nix = { version = "0.31", features = ["fs", "user", "signal"] }
octocrab = { version = "0.54", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "jwt-aws-lc-rs",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "stream",
    "timeout",
    "tracing",
] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
ssh-key = { version = "0.6.7", default-features = false, features = ["std"] }
tokio = { version = "1.48.0", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18" }

[dev-dependencies]
tempfile = "3.26.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
